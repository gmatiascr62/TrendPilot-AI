name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); AGP fetches missing platforms.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + infra, JVM)
        run: ./gradlew :core:test :infra:test --stacktrace

      # Stable signature so each new APK installs as an update (keeps the app's data). The key
      # lives only in the DEBUG_KEYSTORE_B64 secret, never in the public repo; without it the
      # runner's throwaway debug key is used and Android will ask to uninstall first.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/trendpilot.p12"
            echo "TP_KEYSTORE=$RUNNER_TEMP/trendpilot.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 no configurado: el APK usa una firma temporal y no se podrá instalar como actualización."
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            infra/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TrendPilotAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
