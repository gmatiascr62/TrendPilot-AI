name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); AGP fetches missing platforms.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + infra, JVM)
        run: ./gradlew :core:test :infra:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            infra/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TrendPilotAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
